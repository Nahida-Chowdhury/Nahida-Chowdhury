<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Gradient -->
  <defs>
    <linearGradient
      id="logoGradient"
      x1="5"
      y1="5"
      x2="59"
      y2="59"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="0.7" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#D89B3D"/>
    </linearGradient>

    <linearGradient
      id="accentGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#3D3BF0"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient
      id="sparkleGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#4F46E5"
        flood-opacity="0.25"
      />
    </filter>
  </defs>


  <!-- Main Gradient Logo -->
  <rect
    x="5"
    y="5"
    width="54"
    height="54"
    rx="15"
    fill="url(#logoGradient)"
    filter="url(#shadow)"
  />


  <!-- Portfolio White Card -->
  <rect
    x="16"
    y="16"
    width="32"
    height="34"
    rx="7"
    fill="white"
    transform="rotate(-3 32 33)"
  />


  <!-- Profile Avatar -->
  <circle
    cx="23"
    cy="23"
    r="4.5"
    fill="url(#accentGradient)"
  />


  <!-- Portfolio Content Lines -->
  <rect
    x="19"
    y="31"
    width="17"
    height="3"
    rx="1.5"
    fill="#B7B4FF"
  />

  <rect
    x="19"
    y="37"
    width="11"
    height="3"
    rx="1.5"
    fill="#B7B4FF"
  />

  <rect
    x="19"
    y="43"
    width="14"
    height="3"
    rx="1.5"
    fill="#B7B4FF"
  />


  <!-- Creation Sparkle -->
  <circle
    cx="51"
    cy="13"
    r="10"
    fill="url(#sparkleGradient)"
  />

  <!-- Sparkle -->
  <path
    d="M51 7
       L52.8 11.2
       L57 13
       L52.8 14.8
       L51 19
       L49.2 14.8
       L45 13
       L49.2 11.2
       Z"
    fill="white"
  />

</svg>